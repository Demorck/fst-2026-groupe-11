name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a new push cancels the run still going on the same branch or PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gevent
          POSTGRES_PASSWORD: gevent
          POSTGRES_DB: gevent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gevent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # prisma.config.ts needs it even for generate
      DATABASE_URL: postgresql://gevent:gevent@localhost:5432/gevent?schema=public
      # required by env validation when the e2e test boots AppModule; throwaway values, not a real secret
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN_SECONDS: 3600
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - name: Check migrations apply on a fresh database
        run: npx prisma migrate deploy
      - run: npm run build

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
